<body>

    <a href="index 1.html">

    <a href="index 3.html">

    <script type="module">
        import { playhtml } from "https://unpkg.com/playhtml@latest";

        playhtml.init({
            cursors: {
                enabled: true,
                shouldRenderCursor: (presence) => {
                    // Each cursor is { x, y, pointer, zone, page }, or missing if that
                    // person's pointer isn't on the page.
                    for (const person of playhtml.people.everyone) {
                        const { cursor } = person.presence;
                        if (cursor) drawDot(cursor.x, cursor.y, person.color);
                    }

                    // Fires now, then on every cursor move
                    const unsubscribe = playhtml.people.onChange("cursor", redrawMiniMap);
                },
                enableChat: true,
                coodinateMode: "relative"
            }
        });
    </script>
</body>

</html>
