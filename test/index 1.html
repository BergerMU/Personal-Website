<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <link rel="icon" type="image/x-icon" href="../image_assets/awesomeface.ico">
    <link rel="stylesheet" href="index.css">
    <script defer src="index.js"></script>

</html>

<body>
    <h1>Test Page 1</h1>
    <p>Testing cursor paths 1</p>
    <a href="index 2.html">
        <p>Next Page</p>
    </a>
    <script type="module">
        import { playhtml } from "https://unpkg.com/playhtml@latest";

        playhtml.init({
            cursors: {
                enabled: true,
                shouldRenderCursor: (presence) => {
                    // Only render cursors from the same page
                    return presence.page === window.location.pathname;
                },
                enableChat: true,
                coodinateMode: "absolute"
            }
        });

        function drawDot(x, y, color) {
            const dot = document.createElement("div");
            Object.assign(dot.style, {
                position: "absolute",
                left: `${x}px`,
                top: `${y}px`,
                width: "8px",
                height: "8px",
                borderRadius: "50%",
                backgroundColor: color,
                opacity: "0.7",
                pointerEvents: "none",
                zIndex: "9999"
            });

            document.body.append(dot);
            setTimeout(() => dot.remove(), 700);
        }

        function redrawMiniMap(everyone) {
            for (const person of everyone) {
                const { cursor } = person.presence;
                if (cursor) drawDot(cursor.x, cursor.y, person.color);
            }
        }

        // Register once, after initialization.
        playhtml.people.onChange("cursor", redrawMiniMap);
    </script>
</body>

</html>
