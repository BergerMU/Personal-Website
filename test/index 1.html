<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <link rel="icon" type="image/x-icon" href="../image_assets/awesomeface.ico">
    <link rel="stylesheet" href="index.css">
    <script defer src="index.js"></script>

</html>

<body>
    <h1>Test Page 1</h1>
    <p>testing shouldRenderCursor</p>
    <a href="index 2.html">
        <p>Next Page</p>
    </a>
    <script type="module">
        import { playhtml } from "https://unpkg.com/playhtml@latest";

        playhtml.init({
            cursors: {
                enabled: true,
                shouldRenderCursor: (presence) => {
                    // Only render cursors from the same page
                    return presence.page === window.location.pathname;
                }
            }
        });
    </script>
</body>

</html>
