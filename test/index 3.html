    <script type="module">
        import { playhtml } from "https://unpkg.com/playhtml@latest";

        playhtml.init({
            cursors: {
                enabled: true,
                getCursorStyle: (presence) => {
                    if (!presence.cursor) return {};

                    const distance = Math.sqrt(
                        Math.pow(presence.cursor.x - myX, 2) +
                        Math.pow(presence.cursor.y - myY, 2)
                    );

                    if (distance > 500) {
                        return { opacity: '0.3' };
                    }
                    return {};
                }
            }
        });
    </script>
</body>
