    <script type="module">
        import { playhtml } from "https://unpkg.com/playhtml@latest";

        playhtml.init({
            cursors: {
                enabled: true,
                room: "domain",  // All pages share presence
                shouldRenderCursor: (presence) => {
                    // Only render same-page cursors
                    return presence.page === window.location.pathname;
                }
            }
        });

        // Domain-wide count: everyone on any page of the site
        const total = playhtml.people.everyone.length;
    </script>
